# Local run of the full stack on this machine (docs/deploy.md "Local run with Docker").
#   docker compose --env-file .env -f infra/compose.yaml -f infra/compose.local.yaml up --build
# Then open http://localhost:3000. Coolify does not use this file.
services:
  pa-server:
    ports: ["127.0.0.1:3000:3000"]
    environment:
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:3000}
      AUTH_PASSKEY_RP_ID: ${AUTH_PASSKEY_RP_ID:-localhost}
      TRUST_PROXY: ""
  backup:
    # Needs an S3 bucket. Start it on purpose: --profile backup
    profiles: [backup]
