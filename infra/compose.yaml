services:
  pa-server:
    build: { context: .., dockerfile: infra/Dockerfile.server }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    volumes: [pa-data:/data]
    environment:
      LITELLM_URL: ${LITELLM_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AUTH_ORIGIN: ${AUTH_ORIGIN}
      AUTH_PASSKEY_RP_ID: ${AUTH_PASSKEY_RP_ID}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      COOKIE_SECRET: ${COOKIE_SECRET}
      TRUST_PROXY: "1"
      USER_ID: ${USER_ID}
      MODEL: ${MODEL}
      PSEUDO_URL: ${PSEUDO_URL:-http://pseudo-svc:8000}
      BROKER_URL: ${BROKER_URL:-http://sandbox-broker:8100}
      BROKER_TOKEN: ${BROKER_TOKEN}
      SELF_EMAIL: ${USER_GOOGLE_EMAIL:-}
      # Editable copies on the volume, seeded from the image at first start and committed to git
      # on each save (docs/decisions/phase-15-admin.md, decision 4).
      AGENTS_DIR: /data/agents
      AUTOMATIONS_DIR: /data/automations
    # ports: no mapping. Coolify's proxy attaches to container port 3000.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
    mem_limit: 400m
    networks: [internal, mcp]

  # Finnish PII pseudonymization sidecar (plan §6, decision 0003). Holds the encrypted vault in /data.
  pseudo-svc:
    build: { context: .., dockerfile: infra/Dockerfile.pseudo }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    volumes: [pa-data:/data]
    environment:
      PSEUDO_VAULT_KEY: ${PSEUDO_VAULT_KEY:?set PSEUDO_VAULT_KEY}
      VAULT_PATH: /data/vault.db
      SELF_LABEL: ${SELF_LABEL:-[sinä]}
      SELF_NAME: ${SELF_NAME:-}
    # healthcheck: from the image (start period 120 s; spaCy and Omorfi load at startup)
    mem_limit: 1536m  # measured ~1.1 GiB after the 300-line corpus run
    networks: [internal]

  # Runs `bash` tool commands in throwaway pa-skill-runner containers (phase-5 decision 3). The only
  # service with the Docker socket. Root in the container because the socket is root-owned; all
  # capabilities dropped except CHOWN and DAC_OVERRIDE (it creates /data/work/<userId> for uid 10001).
  # Skill containers with `network: internet` join `pa-skill-egress`. Containers with
  # `network: [hosts]` join the internal network `pa-skill-proxy-only` (no gateway) and reach the
  # internet only through the broker's allowlist proxy on port 3128, which the broker reaches
  # through `pa-skill-egress`. Both names are fixed because the broker refers to them.
  sandbox-broker:
    build: { context: .., dockerfile: infra/Dockerfile.broker }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pa-data:/data
    environment:
      BROKER_TOKEN: ${BROKER_TOKEN}
      DATA_DIR: /data
      SKILLS_DIR: /app/skills
      # Bind sources are resolved by the Docker host: set these to the host paths of the pa-data
      # volume and of the repo's skills/ directory (docs/deploy.md).
      HOST_DATA_DIR: ${HOST_DATA_DIR:-}
      HOST_SKILLS_DIR: ${HOST_SKILLS_DIR:-}
      SKILL_RUNNER_IMAGE: ${SKILL_RUNNER_IMAGE:-pa-skill-runner:latest}
    # healthcheck: from the image
    mem_limit: 128m
    networks: [internal, skill-egress, skill-proxy-only]

  # Model egress (plan §4, decision 0004). The only service holding the OpenRouter keys.
  # OPENROUTER_OPEN_API_KEY may stay empty: zdr_guard then refuses open/ models (phase-10).
  litellm:
    image: ghcr.io/berriai/litellm:v1.105.1@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./litellm.yaml:/app/config/litellm.yaml:ro
      - ./litellm/zdr_guard.py:/app/config/zdr_guard.py:ro
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_OPEN_API_KEY: ${OPENROUTER_OPEN_API_KEY:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OR_SITE_URL: ${OR_SITE_URL:-https://assistant.invalid}
      OR_APP_NAME: ${OR_APP_NAME:-assistant-2}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    depends_on:
      presidio-analyzer: { condition: service_healthy }
      presidio-anonymizer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 2s
    mem_limit: 768m  # measured ~510 MB idle, ~590 MB after 10 requests (decision 0004 follow-up)
    networks: [internal]

  # Presidio backstop for the LiteLLM pii-block guardrail (BLOCK only, plan §6).
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./litellm/presidio-recognizers.yaml:/app/conf/presidio-recognizers.yaml:ro
    environment:
      RECOGNIZER_REGISTRY_CONF_FILE: /app/conf/presidio-recognizers.yaml
    healthcheck: { interval: 30s, start_period: 120s, start_interval: 2s }  # test from the image
    mem_limit: 1g  # 700m was OOM-killed at startup under host swap pressure (phase-10 egress runs)
    networks: [internal]

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck: { interval: 30s, start_period: 60s, start_interval: 2s }  # test from the image
    mem_limit: 100m
    networks: [internal]

  # One-shot: a new named volume is root-owned; mcp-workspace and backup run as uid 10001.
  mcp-workspace-init:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:2.1.0@sha256:866733722037ce39de0b4fa6db15c88578876f00eda448799a489d463f334aa3
    entrypoint: ["sh", "-c", "chown 10001:10001 /data/mcp/workspace && chmod 700 /data/mcp/workspace"]
    user: "0:0"
    restart: "no"
    network_mode: none
    volumes: [mcp-workspace-data:/data/mcp/workspace]

  # Google Calendar, Drive (read) and Gmail (read) over MCP (plan §10, decision 0005). Single-user
  # mode has no MCP-level auth: the `mcp` network (pa-server only) is the access control. Never
  # attach it to Coolify's proxy network. Tokens are plain JSON in mcp-workspace-data; the backup
  # service snapshots that volume read-only.
  mcp-workspace:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:2.1.0@sha256:866733722037ce39de0b4fa6db15c88578876f00eda448799a489d463f334aa3
    entrypoint: ["/app/.venv/bin/python", "main.py"]
    command:
      - --transport
      - streamable-http
      - --single-user
      - --tool-tier
      - core
      # --permissions selects the services; --tools cannot be combined with it (main.py exits).
      - --permissions
      - calendar:full
      - drive:readonly
      - gmail:readonly
      - --disabled-tools
      - get_drive_file_download_url
      - get_drive_shareable_link
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, "/home/app:uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    volumes: [mcp-workspace-data:/data/mcp/workspace]
    environment:
      HOME: /home/app
      WORKSPACE_MCP_HOST: 0.0.0.0
      WORKSPACE_MCP_PORT: "8000"
      WORKSPACE_MCP_BASE_URI: http://mcp-workspace
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?set GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${AUTH_ORIGIN}/api/oauth/google/callback
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL:?set USER_GOOGLE_EMAIL}
      WORKSPACE_MCP_CREDENTIALS_DIR: /data/mcp/workspace
      WORKSPACE_MCP_DISABLE_LOCAL_FILES: "true"
      # The hop from pa-server is plain HTTP on the mcp network.
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    depends_on:
      mcp-workspace-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
    mem_limit: 256m
    # Not internal: the server needs egress to Google APIs.
    networks: [mcp]

  # Litestream (app.db, vault.db) plus nightly restic of /data. /data is read-write on purpose:
  # Litestream opens the live WAL database, which needs the -shm file and its own
  # .<db>-litestream state directory next to the database. Same uid as pa-server.
  backup:
    build: { context: .., dockerfile: infra/Dockerfile.backup }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    volumes:
      - pa-data:/data
      - { type: volume, source: mcp-workspace-data, target: /backup-extra/mcp-workspace, read_only: true }
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      RESTIC_REPOSITORY: s3:${S3_ENDPOINT}/${S3_BUCKET}/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      BACKUP_RUN_NOW: ${BACKUP_RUN_NOW:-0}
    mem_limit: 128m
    networks: [internal]

volumes:
  pa-data:
  mcp-workspace-data:

networks:
  internal:
  # pa-server and mcp-workspace only.
  mcp:
  skill-egress: { name: pa-skill-egress }
  skill-proxy-only: { name: pa-skill-proxy-only, internal: true }
