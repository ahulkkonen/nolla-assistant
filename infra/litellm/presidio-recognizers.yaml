# Presidio analyzer recognizer registry (RECOGNIZER_REGISTRY_CONF_FILE).
# FiPersonalIdentityCodeRecognizer defaults to language "fi" and is not in the stock registry;
# registering it for "en" lets one guardrail with presidio_language: en catch hetu, IBAN and
# card numbers without a Finnish spaCy model. See docs/decisions/0004-litellm-openrouter-zdr.md.
supported_languages:
  - en
global_regex_flags: 26
recognizers:
  - name: FiPersonalIdentityCodeRecognizer
    type: predefined
    supported_languages:
      - language: en
        context: [hetu, henkilötunnus, personbeteckning, personal identity code]
  - name: IbanRecognizer
    type: predefined
  - name: CreditCardRecognizer
    type: predefined
