packages:
  - apps/*
  - packages/*
  - services/sandbox-broker
  - tests/*
# Supply-chain rule: never install a release younger than 7 days (minutes).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# Install fails on a dependency build script that allowBuilds does not list.
strictDepBuilds: true
# Exact pins only; see docs/decisions/0001-pi-1.3.0-contract.md
savePrefix: ''
allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@google/genai': false
  protobufjs: false
  # Binaries ship in the package; postinstall only fetches optional CUDA files.
  onnxruntime-node: false
